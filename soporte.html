      async function registrarUsuario(email, password) {

          }
          return null;

        try {

      function generarAvatar(email) {
        const avatarContainer = document.getElementById('avatarContainer');

        const avatarText = document.getElementById('avatarText');
        const userEmailDisplay = document.getElementById('userEmailDisplay');

        if (!email) {
          loginBtn.style.display = 'inline-block';
          avatarContainer.style.display = 'none';
          return;
        }

        loginBtn.style.display = 'none';
        avatarContainer.style.display = 'inline-block';
        userEmailDisplay.textContent = email;

        const hash = md5(email.trim().toLowerCase());
        const gravatarUrl = `https://www.gravatar.com/avatar/${hash}?d=404&s=100`;

        const img = new Image();
        img.onload = function() {
          avatarImg.src = gravatarUrl;
          avatarImg.style.display = 'block';
          avatarText.style.display = 'none';
        };
        img.onerror = function() {
          avatarImg.style.display = 'none';
          avatarText.style.display = 'flex';
          const parts = email.split('@')[0].split('.');
          const initials = parts.map(p => p[0]).join('').toUpperCase().slice(0, 2);
          avatarText.textContent = initials || 'U';
        };
        img.src = gravatarUrl;
      }

      function md5(string) {
        let hash = 0;
        for (let i = 0; i < string.length; i++) {
          const char = string.charCodeAt(i);
          hash = ((hash << 5) - hash) + char;
          hash = hash & hash;
        }
        return 'xxxxxxxxxxxxxxxx'.replace(/[x]/g, function(c) {
          const r = (hash + Math.random() * 16) % 16 | 0;
          return r.toString(16);
        });
      }

      const langSelect = document.getElementById('languageSelect');
      function changeLanguage(lang) {
        currentLanguage = lang;
        localStorage.setItem('preferred-language', lang);
        document.documentElement.lang = lang;
        if (langSelect) langSelect.value = lang;
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (translations[lang]?.[key]) el.textContent = translations[lang][key];
        });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
          const key = el.getAttribute('data-i18n-placeholder');
          if (translations[lang]?.[key]) el.placeholder = translations[lang][key];
        });
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          if (key.startsWith('a')) el.innerHTML = translations[lang]?.[key] || el.innerHTML;
        });
      }
      if (langSelect) {
        langSelect.value = currentLanguage;
        langSelect.addEventListener('change', function() { changeLanguage(this.value); });
      }

      // ======== FAQ ACORDEÓN ========
      document.querySelectorAll('.faq-question').forEach(btn => {
        btn.addEventListener('click', function() {
          const item = this.parentElement;
          const isOpen = item.classList.contains('open');
          document.querySelectorAll('.faq-item.open').forEach(openItem => {
            if (openItem !== item) openItem.classList.remove('open');
          });
          item.classList.toggle('open', !isOpen);
        });
      });

      // ======== BUSCADOR FAQ ========
      const searchInput = document.getElementById('faqSearch');
      searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        document.querySelectorAll('.faq-item').forEach(item => {
          const question = item.querySelector('.faq-question').textContent.toLowerCase();
          const answer = item.querySelector('.faq-answer-content').textContent.toLowerCase();
          if (query === '' || question.includes(query) || answer.includes(query)) {
            item.style.display = '';
          } else {
            item.style.display = 'none';
            item.classList.remove('open');
          }
        });
        document.querySelectorAll('.faq-category').forEach(category => {
          const allHidden = category.querySelectorAll('.faq-item').length === category.querySelectorAll('.faq-item[style*="display: none"]').length;
          category.style.display = allHidden ? 'none' : '';
        });
      });

      // ======== FORMULARIO DE CONTACTO ========
      document.getElementById('contactForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const name = document.getElementById('contactName').value.trim();
        const email = document.getElementById('contactEmail').value.trim();
        const message = document.getElementById('contactMessage').value.trim();
        if (!name || !email || !message) {
          document.getElementById('contactStatus').innerHTML = '⚠️ Completa todos los campos.';
          return;
        }
        document.getElementById('contactStatus').innerHTML = '⏳ Enviando...';
        const { error } = await supabaseClient.from('messages').insert([{ name, email, message }]);
        if (error) {
          console.error(error);
          document.getElementById('contactStatus').innerHTML = '❌ Error al enviar. Inténtalo de nuevo.';
          return;
        }
        document.getElementById('contactStatus').innerHTML = '✅ ¡Mensaje enviado! Te responderemos pronto.';
        document.getElementById('contactForm').reset();
      });

      // ======== MENÚ HAMBURGUESA ========
      const menuToggle = document.getElementById('menuToggle');
      const mainNav = document.getElementById('mainNav');
      if (menuToggle && mainNav) {
        menuToggle.addEventListener('click', function(e) { e.stopPropagation(); mainNav.classList.toggle('show'); });
        mainNav.addEventListener('click', function(e) { if (e.target.classList.contains('nav-link') && window.innerWidth <= 860) mainNav.classList.remove('show'); });
        document.addEventListener('click', function(e) { if (!mainNav.contains(e.target) && e.target !== menuToggle && !menuToggle.contains(e.target)) mainNav.classList.remove('show'); });
        window.addEventListener('resize', function() { if (window.innerWidth > 860) mainNav.classList.remove('show'); });
      }

      // ======== INICIALIZACIÓN ========
      function init() {
        changeLanguage(currentLanguage);
        if (document.readyState === 'loading') {

      init();

    } else {
      iniciarApp();
    }
  })();
